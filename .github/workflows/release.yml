name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Derle
        run: dotnet build "Fatih Kalem.csproj" -c Release -o dist/windows-build
      - name: Sürüm numarası
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not ($v -match '^\d+\.\d+')) { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Taşınabilir zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive -Path "dist/windows-build/Fatih Kalem.exe", "dist/windows-build/Fatih Kalem.exe.config", README.md, CHANGELOG.md, LICENSE -DestinationPath "dist/windows/FatihKalem-$v-windows.zip"
      - name: Kurulum sihirbazı
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/fatih-kalem.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe

  pardus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 \
            python3-pytest make xvfb xauth fonts-dejavu-core
      - name: Testler (arayüz testleri sanal ekranda)
        working-directory: linux
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m pytest -q tests
      - name: .deb paketi
        working-directory: linux
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: pardus
          path: dist/*.deb

  release:
    needs: [windows, pardus]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Sürüm notları
        run: |
          # CHANGELOG.md'den yalnızca bu sürümün bölümü
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Fatih Kalem ${{ github.ref_name }}
          body_path: notes.md
          files: |
            artifacts/windows/*.zip
            artifacts/windows/*.exe
            artifacts/pardus/*.deb
