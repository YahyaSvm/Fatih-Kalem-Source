name: Sürüm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Derle
        run: dotnet build "Fatih Kalem.csproj" -c Release -o out
      - name: Paketle
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not $v -or $v -eq "main") { $v = "dev" }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item "out/Fatih Kalem.exe", "out/Fatih Kalem.exe.config" pkg/
          Copy-Item README.md, CHANGELOG.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "FatihKalem-$v-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: FatihKalem-*-windows.zip

  pardus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 python3-pytest make
      - name: Testler
        working-directory: linux
        run: make test
      - name: .deb paketi
        working-directory: linux
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: pardus
          path: dist/*.deb

  release:
    needs: [windows, pardus]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Fatih Kalem ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            artifacts/windows/*.zip
            artifacts/pardus/*.deb
